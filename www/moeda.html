<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara ou Coroa — Nairon Dalmaso</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="grain"></div>

  <header>
    <nav><span class="mono">CARA&nbsp;OU&nbsp;COROA</span></nav>
  </header>

  <!-- fixo na tela e não no header: assim dá pra animar a posição dele
       junto com a abertura do menu, terminando encostado na borda do painel -->
  <button class="hamburger-menu" id="hamburgerMenu" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- menu lateral: efeito inspirado em reactbits.dev/components/card-nav (cards),
       reimplementado em JS puro (sem React/GSAP) como um drawer que desliza pela lateral -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="mono drawer-title">MENU</span>
    </div>

    <div class="drawer-cards">
      <div class="nav-card nav-card-earth">
        <div class="nav-card-label mono">JOGOS</div>
        <div class="nav-card-links">
          <a class="nav-card-link mono" href="index.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Início
          </a>
          <a class="nav-card-link mono" href="velha.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Jogo da Velha
          </a>
          <a class="nav-card-link mono" href="ligue4.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Ligue 4
          </a>
          <a class="nav-card-link mono" href="bomba.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Bomba
          </a>
          <a class="nav-card-link mono" href="xadrez.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Xadrez
          </a>
          <a class="nav-card-link mono" href="campo-minado.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Campo Minado
          </a>
          <a class="nav-card-link mono" href="damas.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Damas
          </a>
          <a class="nav-card-link mono" href="2048.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            2048
          </a>
          <a class="nav-card-link mono" href="memoria.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Jogo da Memória
          </a>
          <a class="nav-card-link mono" href="truco.html">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            Truco
          </a>
          <span class="nav-card-link nav-card-link-soon mono">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Mais em breve
          </span>
        </div>
      </div>
      <div class="nav-card nav-card-night">
        <div class="nav-card-label mono">PORTFÓLIO</div>
        <div class="nav-card-links">
          <a class="nav-card-link mono" href="https://nairondalmaso.com.br" target="_blank" rel="noopener">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            nairondalmaso.com.br
          </a>
        </div>
      </div>
      <div class="nav-card nav-card-gold">
        <div class="nav-card-label mono">CÓDIGO</div>
        <div class="nav-card-links">
          <a class="nav-card-link mono" href="https://github.com/Nero1Dev" target="_blank" rel="noopener">
            <svg class="nav-card-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            GitHub
          </a>
        </div>
      </div>
    </div>
  </aside>

  <main class="wrap">
    <section class="intro" data-reveal>
      <span class="eyebrow mono">// SORTE OU AZAR</span>
      <h1 class="display">CARA<br>OU<span class="hl">&nbsp;COROA</span></h1>
    </section>

    <section class="coin-game" data-reveal>

      <div class="coin-stage" id="coinStage">
        <div class="coin" id="coin">
          <div class="coin-face front">
            <svg class="coin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/>
              <path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"/>
            </svg>
          </div>
          <div class="coin-face back">
            <svg class="coin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="8.5" width="16" height="9" rx="4.5"/>
              <line x1="8" y1="11.3" x2="8" y2="14.7"/>
              <line x1="6.3" y1="13" x2="9.7" y2="13"/>
              <circle cx="15.2" cy="11.6" r="0.9" fill="currentColor" stroke="none"/>
              <circle cx="17.2" cy="13.6" r="0.9" fill="currentColor" stroke="none"/>
            </svg>
          </div>
        </div>
        <div class="coin-shadow"></div>
      </div>

      <p class="mono coin-status" id="coinStatus">TOQUE&nbsp;EM&nbsp;GIRAR</p>

      <button class="btn btn-solid mono" id="flipBtn">GIRAR&nbsp;A&nbsp;MOEDA</button>

      <div class="stats">
        <div>
          <b id="scoreCara">0</b>
          <span class="mono">CARA</span>
        </div>
        <div>
          <b id="scoreTotal">0</b>
          <span class="mono">JOGADAS</span>
        </div>
        <div>
          <b id="scoreCoroa">0</b>
          <span class="mono">COROA</span>
        </div>
      </div>

      <button class="btn btn-ghost mono" id="resetScoreBtn">ZERAR&nbsp;PLACAR</button>

    </section>
  </main>

  <footer>
    <p class="foot-credit mono">
      Desenvolvido por <a href="https://github.com/Nero1Dev" target="_blank" rel="noopener">Nero1dev</a>
    </p>
  </footer>

  <script src="nav.js"></script>
  <script src="moeda.js"></script>
</body>
</html>
